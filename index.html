<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Витрина — подборка приложений из App Store</title>
  <meta name="description" content="Личная подборка полезных и интересных приложений из App Store.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF5A36'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' fill='%2317100D' text-anchor='middle'%3EВ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-block">
        <a href="index.html" class="logo">Витрина</a>
        <span class="logo-tagline">Личная подборка приложений из App Store</span>
      </div>
      <nav class="main-nav" id="categoryNav" aria-label="Категории"></nav>
      <div class="header-actions">
        <input type="search" id="searchInput" placeholder="Найти приложение…" aria-label="Поиск">
        <a class="admin-link" href="admin.html" title="Админ-панель" aria-label="Админ-панель">⚙</a>
      </div>
    </div>
  </header>

  <main>
    <section id="featuredSlot"></section>
    <section>
      <div class="feed-grid" id="feedGrid"></div>
      <p class="empty-state" id="emptyState" hidden>Ничего не нашлось. Попробуйте другую категорию или запрос.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Витрина — личная подборка приложений из App Store. Проект не связан с Apple Inc.</p>
  </footer>

  <script src="js/apps-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
