<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0b0d"
  >

  <meta
    name="description"
    content="Приложение — Vitrina."
  >

  <title>Приложение — Vitrina</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <div class="app-shell">

    <header class="topbar">

      <div class="topbar-side">

        <a
          class="back-button"
          href="index.html"
          aria-label="Назад"
        >
          ‹
        </a>

      </div>

      <a
        class="wordmark"
        href="index.html"
      >
        vitrina
      </a>

      <div class="topbar-side">

        <a
          class="icon-button"
          href="admin.html"
          aria-label="Админка"
        >
          ☰
        </a>

      </div>

    </header>

    <main class="detail-main">

      <section
        id="appDetail"
        class="app-detail"
        aria-live="polite"
      ></section>

      <p
        id="detailEmpty"
        class="empty-state"
        hidden
      >
        Приложение не найдено.
      </p>

    </main>

    <nav
      class="bottom-nav"
      aria-label="Основная навигация"
    >

      <a
        class="nav-item active"
        href="index.html"
        aria-label="Главная"
      >
        <span>⌂</span>
      </a>

      <a
        class="nav-item"
        href="index.html#searchInput"
        aria-label="Поиск"
      >
        <span>⌕</span>
      </a>

      <a
        class="nav-item nav-plus"
        href="index.html#feed"
        aria-label="Каталог"
      >
        +
      </a>

      <a
        class="nav-item"
        href="index.html#featuredOnly"
        aria-label="Избранное"
      >
        <span>♡</span>
      </a>

      <a
        class="nav-item"
        href="admin.html"
        aria-label="Профиль"
      >
        <span>○</span>
      </a>

    </nav>

  </div>

  <script src="js/apps-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app-detail.js"></script>

</body>
</html>
