<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0b0d">
  <title>Админ — Vitrina</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">VITRINA</a>
      <a class="admin-link" href="index.html">← Каталог</a>
    </div>
  </header>
  <main class="container admin-page">
    <section class="admin-card">
      <p class="eyebrow">ADMIN</p>
      <h1>Управление каталогом</h1>
      <p class="muted">Изменения сохраняются локально в браузере.</p>
      <div id="loginPanel">
        <label class="field">
          <span>Пароль</span>
          <input id="passwordInput" type="password" autocomplete="current-password">
        </label>
        <button id="loginButton" class="button" type="button">Войти</button>
        <p id="loginError" class="form-error" hidden>Неверный пароль.</p>
      </div>
      <div id="adminPanel" hidden>
        <div class="admin-actions">
          <button id="exportButton" class="button" type="button">Экспорт JSON</button>
          <label class="button button-secondary">
            Импорт JSON
            <input id="importInput" type="file" accept="application/json,.json" hidden>
          </label>
          <button id="resetButton" class="button button-danger" type="button">Сбросить</button>
          <button id="logoutButton" class="button button-secondary" type="button">Выйти</button>
        </div>
        <form id="appForm" class="app-form">
          <input id="editingId" type="hidden">
          <label class="field"><span>Название</span><input id="nameInput" required maxlength="100"></label>
          <label class="field"><span>Описание</span><textarea id="descriptionInput" required maxlength="500"></textarea></label>
          <label class="field"><span>Категория</span><input id="categoryInput" required maxlength="50"></label>
          <label class="field"><span>Иконка URL</span><input id="iconInput" type="url" required></label>
          <label class="field"><span>Store URL</span><input id="storeInput" type="url" required></label>
          <label class="field"><span>Скриншоты — URL через запятую</span><textarea id="screenshotsInput"></textarea></label>
          <label class="checkbox-field"><input id="featuredInput" type="checkbox"><span>Избранное</span></label>
          <div class="admin-actions">
            <button class="button" type="submit">Сохранить</button>
            <button id="cancelEditButton" class="button button-secondary" type="button">Очистить</button>
          </div>
        </form>
        <div id="adminList" class="admin-list"></div>
      </div>
    </section>
  </main>
  <script src="js/apps-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
